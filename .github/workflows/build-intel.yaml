name: Build Intel macOS DMG

on:
  workflow_dispatch:
  push:
    branches: ['codex/macos-intel-dmg']

permissions:
  contents: read

concurrency:
  group: intel-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Flutter revision
        id: sdk
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + json.loads(Path('.fvmrc').read_text())['flutter'] + '\n')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ steps.sdk.outputs.revision }}
          cache: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packaging tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          npm install -g appdmg
          dart pub global activate fastforge 0.6.6
      - name: Verify macOS architectures and native packaging
        run: python3 -m unittest discover -s scripts/tests -p 'test_macos*.py' -v
      - name: Build Intel runtimes and DMG
        run: bash build-macos-intel.sh
      - name: Verify application starts on Intel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import subprocess
          import time

          app = Path('build/macos/Build/Products/Release/Reveric.app').resolve()
          with (app / 'Contents/Info.plist').open('rb') as stream:
              executable = plistlib.load(stream)['CFBundleExecutable']
          log = Path('build/macos-intel/startup.log')
          with log.open('w') as output:
              process = subprocess.Popen([str(app / 'Contents/MacOS' / executable)],
                                         stdout=output, stderr=subprocess.STDOUT)
              try:
                  time.sleep(20)
                  if process.poll() is not None:
                      raise SystemExit('Application exited during startup:\n' + log.read_text())
                  print('Intel application stayed running for 20 seconds.')
              finally:
                  if process.poll() is None:
                      process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reveric-macos-intel-${{ github.run_id }}
          path: |
            dist/**/*-macos-x86_64.dmg
            dist/**/*.sha256
            dist/**/*.build.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intel-startup-${{ github.run_id }}
          path: build/macos-intel/startup.log
          if-no-files-found: ignore
          retention-days: 7
